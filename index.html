<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเฝ้าระวังฝนและน้ำท่วม อ.หาดใหญ่ (Hybrid Pastel Edition)</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Kanit', sans-serif; }
        
        /* Custom Scrollbar โทนพาสเทลสว่าง */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* หมุดบนแผนที่สไตล์พาสเทล + ป้ายชื่อ Glassmorphism */
        .station-marker-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        .station-pin {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #ffffff;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
            transition: transform 0.2s ease;
        }
        .station-marker-wrapper:hover .station-pin {
            transform: scale(1.15);
        }
        .pin-safe { background: linear-gradient(135deg, #34d399, #10b981); }
        .pin-rain { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
        .pin-watch { background: linear-gradient(135deg, #fbbf24, #f59e0b); animation: pulse-amber 2s infinite; }
        .pin-danger { background: linear-gradient(135deg, #fb7185, #e11d48); animation: pulse-rose 1.4s infinite; }

        .station-label {
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
        }

        @keyframes pulse-amber {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65); }
            70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        @keyframes pulse-rose {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.75); }
            70% { box-shadow: 0 0 0 14px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 1. Top Header (Pastel Light) -->
    <header class="bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 z-[1000] shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-500 text-white flex items-center justify-center shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                </svg>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base md:text-lg font-bold text-slate-800">ระบบเฝ้าระวังฝนและน้ำท่วม อ.หาดใหญ่</h1>
                    <span class="bg-sky-100 text-sky-700 border border-sky-200 text-xs font-medium px-2.5 py-0.5 rounded-full">
                        Hybrid 3 แหล่งข้อมูล (ECMWF + GFS + สสน.)
                    </span>
                </div>
                <p class="text-xs text-slate-500">วิเคราะห์จุดฝนกำลังตก • พยากรณ์ล่วงหน้า 1–24 ชม. • เฝ้าระวังลุ่มน้ำคลองอู่ตะเภาและเขาคอหงส์</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <!-- ปุ่มดึงข้อมูลจริง -->
            <button onclick="loadLiveHybridData()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs md:text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5">
                <span>🔄</span> ดึงข้อมูลจริง (Live API)
            </button>

            <!-- Dropdown โหมดจำลองพายุฝน -->
            <div class="relative">
                <select id="sim-selector" onchange="handleSimulationChange(this.value)" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs md:text-sm font-medium px-3 py-2 rounded-xl cursor-pointer outline-none transition">
                    <option value="live">⚡ โหมดจำลองพายุฝน (Test Simulation)</option>
                    <option value="urban_storm">🌧️ จำลองที่ 1: พายุฝนถล่มเมืองหาดใหญ่ + เขาคอหงส์</option>
                    <option value="upstream_flood">🌊 จำลองที่ 2: น้ำหลากจากต้นน้ำสะเดา + คลองหลา</option>
                    <option value="extreme_crisis">🚨 จำลองที่ 3: วิกฤตขั้นสุด ฝนแช่ทั้งลุ่มน้ำ + น้ำคลองสูง</option>
                </select>
            </div>

            <!-- ปุ่มสรุปข้อความส่ง LINE -->
            <button onclick="openLineModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs md:text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5">
                <span>💬</span> สรุปข้อความแจ้งเตือน LINE
            </button>

            <!-- เวลาอัปเดต -->
            <div class="bg-slate-100 text-slate-600 border border-slate-200 text-xs px-3 py-2 rounded-xl">
                🕒 <span id="last-update-text">กำลังโหลด...</span>
            </div>
        </div>
    </header>

    <!-- 2. Overall Status Banner -->
    <div id="overall-banner" class="bg-emerald-50 border-b border-emerald-200 px-5 py-2 flex flex-wrap items-center justify-between gap-2 transition-colors">
        <div class="flex items-center gap-2.5">
            <span id="overall-badge" class="bg-emerald-500 text-white text-xs font-semibold px-3 py-1 rounded-full shadow-sm">
                ● สถานการณ์ปกติ
            </span>
            <span id="overall-message" class="text-xs md:text-sm font-medium text-emerald-900">
                ปริมาณน้ำฝนและระดับน้ำคลองอู่ตะเภาอยู่ในเกณฑ์ปลอดภัย
            </span>
        </div>
        <div class="flex items-center gap-4 text-xs font-medium text-slate-600">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span> กำลังตก: <strong id="sum-raining" class="text-slate-800">0</strong> จุด</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> กำลังจะตก (1-3 ชม.): <strong id="sum-soon" class="
